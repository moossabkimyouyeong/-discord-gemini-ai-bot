<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discord 명령어 등록</title><body style="font:18px system-ui;padding:28px"><h2>디스코드 /메뉴 등록</h2><p>봇 토큰을 Netlify 환경변수에 저장한 다음 아래 버튼을 누르세요.</p><button id="go" style="font-size:20px;padding:16px">/메뉴 등록하기</button><pre id="result" style="white-space:pre-wrap"></pre><script>document.getElementById('go').onclick=async()=>{const b=document.getElementById('go'),o=document.getElementById('result');b.disabled=true;o.textContent='등록 요청 중...';try{const r=await fetch('/register-command',{method:'POST'}),j=await r.json();o.textContent=j.ok?'등록 성공! 디스코드에서 /메뉴를 입력해 보세요.':'실패: '+(j.error||j.status)}catch(e){o.textContent='연결 오류: '+e.message}finally{b.disabled=false}}</script></body></html>
